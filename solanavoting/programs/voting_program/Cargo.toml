[package]
name = "groth16-test"
version = "0.2.0"
description = "groth16-solana test program"
edition = "2021"

[features]
idl-build = ["anchor-lang/idl-build"]

[lib]
crate-type = ["cdylib", "lib"]
name = "groth16_test"

[dependencies]
anchor-lang = "0.30.1"
thiserror = "1.0"
ark-serialize = "0.4.2"
ark-ec = "0.4.2"
ark-ff = "0.4.2"
ark-bn254 = "0.4.0"
num-bigint = "0.4.6"
groth16-solana = "0.0.3"
proc-macro2 = "=1.0.94"
anchor-syn = "0.30.1"
syn = "2.0.46"


[dev-dependencies]
ark-std = "0.4.0"
array-bytes = "6.2.2"
serde = "1.0.195"
serde_json = "1.0.111"

[package.metadata.solana]
address-sanitizer = false
leak-sanitizer = false
max-stack-frame-size = 65536